{% extends 'base.html' %}
{% block title %}{{ action }} Usuario - Agroveterinaria Planeta Animal{% endblock %}
{% block topbar_title %}{{ action }} Usuario{% endblock %}
{% block content %}
<div class="page-header"><div class="page-title"><span class="icon"><i data-lucide="{% if action == 'Nuevo' %}user-plus{% else %}pencil{% endif %}"></i></span><h1>{{ action }} Usuario</h1></div><a href="{% url 'users_index' %}" class="btn btn-outline"><i data-lucide="arrow-left"></i> Volver</a></div>
<div class="card" style="max-width:520px"><form method="POST">{% csrf_token %}
  <div class="form-group"><label class="form-label">Nombre completo *</label><input type="text" name="full_name" class="form-control" required value="{{ form.full_name.value|default:'' }}" placeholder="Nombre y apellido"></div>
  <div class="form-group"><label class="form-label">Identificacion *</label><input type="text" name="identification" class="form-control" required value="{{ form.identification.value|default:'' }}" {% if user_obj %}readonly{% endif %} placeholder="Numero de identificacion"></div>
  <div class="form-group"><label class="form-label">Correo electronico *</label><input type="email" name="email" class="form-control" required value="{{ form.email.value|default:'' }}" placeholder="correo@email.com"></div>
  <div class="form-group"><label class="form-label">Telefono</label><input type="tel" name="phone" class="form-control" value="{{ form.phone.value|default:'' }}" placeholder="3001234567"></div>
  <div class="form-group"><label class="form-label">Contrasena {% if user_obj %}(dejar vacio para no cambiar){% else %}*{% endif %}</label><input type="password" name="password" class="form-control" {% if not user_obj %}required{% endif %} placeholder="Contrasena"></div>
  <div class="form-group"><label class="form-label">Rol *</label><select name="role" class="form-control">{% for value,label in form.role.field.choices %}<option value="{{ value }}" {% if form.role.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="flex-gap mt-2"><button type="submit" class="btn btn-primary"><i data-lucide="{% if action == 'Nuevo' %}user-plus{% else %}save{% endif %}"></i>{% if action == 'Nuevo' %}Crear Usuario{% else %}Guardar Cambios{% endif %}</button><a href="{% url 'users_index' %}" class="btn btn-outline">Cancelar</a></div>
</form></div>
{% endblock %}
